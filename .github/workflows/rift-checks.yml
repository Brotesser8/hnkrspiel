name: RIFT checks

on:
  push:
    branches: [main, feat/rift-live-earth-game]
    paths:
      - 'rift/**'
      - '.github/workflows/rift-checks.yml'
  pull_request:
    paths:
      - 'rift/**'
      - '.github/workflows/rift-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser and logic syntax
        run: |
          node --check rift/app.js
          node --check rift/logic.mjs
      - name: Test earthquake adapters, game rules and structure
        run: node --test rift/tests/*.test.mjs
