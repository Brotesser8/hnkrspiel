name: FREQUENCY checks
on:
  push:
    branches: [main]
    paths:
      - 'nebenan/**'
      - '.github/workflows/nebenan-checks.yml'
  pull_request:
    paths:
      - 'nebenan/**'
      - '.github/workflows/nebenan-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app and tests
        run: |
          node --check nebenan/core.mjs
          node --check nebenan/api.mjs
          node --check nebenan/app.mjs
          node --check nebenan/guess/data.mjs
          node --check nebenan/guess/api.mjs
          node --check nebenan/guess/game.mjs
          node --check nebenan/tests/core.test.mjs
          node --check nebenan/tests/browser-smoke.mjs
          node --check nebenan/guess/tests/data.test.mjs
          node --check nebenan/guess/tests/browser-smoke.mjs
      - name: Test data adapters and HTTP caching
        run: node --test nebenan/tests/core.test.mjs nebenan/guess/tests/data.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.58.2
      - name: Verify Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Exercise all six channels and responsive layouts
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          node nebenan/tests/browser-smoke.mjs
          node nebenan/guess/tests/browser-smoke.mjs
      - name: Save visual reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frequency-browser-screenshots
          path: |
            nebenan/test-artifacts/
            nebenan/guess/test-artifacts/
          if-no-files-found: ignore
