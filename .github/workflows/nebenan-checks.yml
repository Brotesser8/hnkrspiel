name: NEBENAN checks
on:
  push:
    branches: [main]
    paths:
      - 'nebenan/**'
      - '.github/workflows/nebenan-checks.yml'
  pull_request:
    paths:
      - 'nebenan/**'
      - '.github/workflows/nebenan-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check nebenan/core.mjs
          node --check nebenan/api.mjs
          node --check nebenan/app.mjs
          node --check nebenan/map-ui.mjs
          node --check nebenan/map-data.mjs
          node --check nebenan/tests/browser-smoke.mjs
      - name: Run pure unit tests
        run: node --test nebenan/tests/*.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-save playwright@1.58.2
      - name: Verify runner browser
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Test country changes, interactive modules and phone layout
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: node nebenan/tests/browser-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebenan-browser
          path: nebenan/test-artifacts/
          if-no-files-found: ignore
